name: Update profile activity cards

on:
  push:
    paths:
      - "README.md"
      - "scripts/update_profile_assets.py"
      - ".github/workflows/update-profile-assets.yml"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate self-hosted cards
        run: python3 scripts/update_profile_assets.py

      - name: Save refreshed cards
        run: |
          if git diff --quiet -- assets/*.svg; then
            echo "Profile cards are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "Update profile activity cards"
          git push
